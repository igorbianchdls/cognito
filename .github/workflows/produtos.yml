# Produto: tipos, lint (tudo menos o marketing), smokes dos servidores MCP (ChatGPT e Claude) em bancos isolados (PGlite)
# e o build de produção, para um erro de build aparecer aqui e não só na Vercel.
# Nenhum teste acessa o banco de produção nem precisa de segredos.
name: Produtos

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: produtos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tipos
        run: pnpm typecheck
      - name: Lint do produto (tudo menos marketing)
        run: pnpm lint:produtos
      - name: Smokes (ChatGPT e Claude)
        run: pnpm test:produtos
      - name: Build de produção
        run: pnpm build
